name: Supabase keep-alive

# Supabase pauses free-tier projects after about a week without activity.
# This runs a tiny database query twice a week so the project stays awake.
#
# Requires two repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL       - same value as NEXT_PUBLIC_SUPABASE_URL
#   SUPABASE_ANON_KEY  - same value as NEXT_PUBLIC_SUPABASE_ANON_KEY

on:
  schedule:
    - cron: "0 3 * * 1,4" # Mondays and Thursdays, 10:00 Thailand time
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY secret" >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/projects?select=id&limit=1"
